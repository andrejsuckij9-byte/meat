<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>MeatTrack</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="logo">🥩 <b>MeatTrack</b></div><button id="install" class="ghost" hidden>Install</button></header>
<main>
<section class="welcome"><div><small>INVENTORY CONTROL</small><h1>Keep your meat<br>fresh & under control.</h1><p>Track expiry dates, batches and stock in one place.</p></div><button class="add" onclick="openForm()">＋ Add product</button></section>

<section class="stats">
<div><span>Total products</span><strong id="total">0</strong></div>
<div><span>Expiring soon</span><strong id="soon">0</strong></div>
<div><span>Expired</span><strong id="expired">0</strong></div>
<div><span>Total units</span><strong id="units">0</strong></div>
</section>

<div class="tools"><input id="search" placeholder="🔎 Search product or batch"><select id="filter"><option value="all">All status</option><option value="fresh">Fresh</option><option value="soon">Expiring soon</option><option value="expired">Expired</option></select></div>
<div id="list" class="list"></div><div id="empty" class="empty">🥩<h2>No products yet</h2><p>Add your first product to start tracking expiry dates.</p><button class="add" onclick="openForm()">＋ Add product</button></div>
</main>

<div id="modal" class="modal hidden"><div class="modalbox"><button class="x" onclick="closeForm()">×</button><h2>Add product</h2>
<form id="form">
<label>Product name<input name="name" required placeholder="Chicken Breast"></label>
<div class="row"><label>Category<select name="category"><option>Chicken</option><option>Beef</option><option>Pork</option><option>Lamb</option><option>Other</option></select></label>
<label>Quantity<input name="qty" type="number" min="1" value="1" required></label></div>
<div class="row"><label>Expiry date<input name="expiry" type="date" required></label><label>Batch number<input name="batch" placeholder="CH-061026"></label></div>
<label>Storage / note<textarea name="note" placeholder="Fridge 2"></textarea></label>
<button class="add wide">Save product</button>
</form></div></div>
<script src="app.js"></script>
</body></html>
